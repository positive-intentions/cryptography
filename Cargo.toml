[package]
name = "signal-protocol-wasm"
version = "0.1.0"
edition = "2021"
description = "Signal Protocol implementation in Rust compiled to WebAssembly"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

# Use simpler, compatible crypto dependencies
sha2 = "0.9"
hkdf = "0.10"
aes-gcm = "0.8"
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }

# Error handling
thiserror = "1.0"

# Hex encoding for debugging
hex = "0.4"

# Development dependencies for testing and coverage
[dev-dependencies]
wasm-bindgen-test = "0.3"

# Enable optimizations for WASM build
[profile.release]
opt-level = "s"  # Optimize for size
lto = true       # Enable link-time optimization
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-mutable-globals"]